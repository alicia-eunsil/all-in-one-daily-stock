name: Merge index codes (KR_Stocks_Individual)

on:
  schedule:
    - cron: "10 7 * * *"   # 매일 KST 16:10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run merge script
        run: |
          python merge_index_codes.py

      - name: Commit and push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep -q "KR_Stocks_Individual.xlsx"; then
            git add KR_Stocks_Individual.xlsx
            git commit -m "Update index sheet (merge duplicate codes)"
            git push
          else
            echo "No changes to commit."
          fi
