name: Merge index codes (KR_Stocks_Individual)

on:
  schedule:
    - cron: "10 7 * * *"   # 매일 KST 16:10 (UTC 07:10) 예시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run merge script
        run: |
          python merge_index_codes.py

      - name: Commit and push result (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 결과 파일이 생성/변경되었을 때만 커밋
          if git status --porcelain | grep -q "KR_Stocks_Individual_merged.xlsx"; then
            git add KR_Stocks_Individual_merged.xlsx
            git commit -m "Update merged index sheet"
            git push
          else
            echo "No changes to commit."
          fi
