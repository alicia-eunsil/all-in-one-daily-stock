name: Set Excel Cell Value (Defaults Only)

on:
  workflow_dispatch: {}   # 입력 없이 Run workflow 버튼만 표시

permissions:
  contents: write

jobs:
  run-set-cell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true   # 엑셀이 LFS일 가능성 대비

      - name: Show workspace files (debug)
        run: |
          pwd
          ls -la
          ls -la KR_Stocks_ETF.xlsx || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run set_cell_value script (use defaults)
        run: |
          python set_cell_value.py

      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add KR_Stocks_ETF.xlsx
          git commit -m "chore: set cell value in KR_Stocks_ETF.xlsx"
          git push
