name: Fetch daily stock closes

on:
  schedule:
    - cron: "35 7 * * 1-6"   # 매일 KST 16:35, 일요일 제외
  workflow_dispatch:       # 필요 시 수동 실행도 가능

permissions:
  contents: write  # 결과 파일 커밋·푸시를 위해 필요

jobs:
  run-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # 🔥 점수 계산용(_totalSZ.py, _extra_scores.py)까지 고려해서 기본 패키지 설치
            pip install requests openpyxl pandas numpy
          fi

      - name: Create secrets.json from GitHub Secrets
        run: |
          cat > secrets.json << 'EOF'
          {
            "api_key":    "${{ secrets.API_KEY }}",
            "api_secret": "${{ secrets.API_SECRET }}",
            "domain":     "${{ secrets.DOMAIN }}"
          }
          EOF

      - name: Run stock scripts (4 Excel files 전체 처리)
        run: |
          # 1) 국내/해외 개별 + ETF 원자료(시가/고가/저가/종가/거래량 + 지수) 수집
          python "stock_history.py"
          # 2) 4개 엑셀에 대해 S/Z + GAP/QUANT/STD 계산 (_totalSZ.py + _extra_scores.py 내부에서 호출)
          python "run_all_scores.py"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 변경사항이 있을 때만 커밋
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-update stock values: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          else
            echo "No changes to commit."
          fi
