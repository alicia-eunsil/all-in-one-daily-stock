# .github/workflows/delete-excel-columns.yml
# 목적: GitHub Actions에서 입력 인자 없이 실행하여,
#      파이썬 스크립트(delete_excel_columns.py)의 DEFAULT_* 값을 그대로 사용함.

name: Delete Excel Columns (Defaults Only)

on:
  workflow_dispatch: {}  # 입력창 없이 "Run workflow" 버튼만 표시

permissions:
  contents: write

jobs:
  run-delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      # 중요: 여기서 --file / --sheet / --start_col / --end_col 을 절대 넘기지 않습니다.
      # 따라서 스크립트의 DEFAULT_FILE/DEFAULT_SHEET/DEFAULT_START_COL/DEFAULT_END_COL 이 적용됩니다.
      - name: Run delete script (use script defaults)
        run: |
          python scripts/delete_excel_columns.py

      # 변경된 엑셀 파일을 레포에 반영하려면 커밋/푸시가 필요합니다.
      # (삭제 작업은 워크스페이스 파일을 바꾸는 것이라, 푸시하지 않으면 레포에 남지 않습니다.)
      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: delete excel columns (defaults only)"
          git push
