name: Delete Excel Columns (KR_Stocks_Individual)

on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "Sheet name"
        required: true
        default: "std"
      start_col:
        description: "Start column (e.g., BZ or 78)"
        required: true
        default: "BZ"
      end_col:
        description: "End column (e.g., CR or 96)"
        required: true
        default: "CR"

permissions:
  contents: write

jobs:
  delete-cols:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run delete script
        run: |
          python temp/delete_excel_columns.py --file KR_Stocks_Individual.xlsx

      - name: Commit and push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep -q "KR_Stocks_Individual.xlsx"; then
            git add KR_Stocks_Individual.xlsx
            git commit -m "Delete columns ${{ inputs.start_col }}-${{ inputs.end_col }} in ${{ inputs.sheet }}"
            git push
          else
            echo "No changes to commit."
          fi
