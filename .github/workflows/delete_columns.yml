# 목적: 입력 인자 없이 delete_excel_columns.py를 기본값(DEFAULT_*) 그대로 실행한다.

name: Delete Excel Columns (Defaults Only)

on:
  workflow_dispatch: {}  # 입력창 없이 "Run workflow" 버튼만 표시

permissions:
  contents: write

jobs:
  run-delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      # 중요: 여기서 --file / --sheet / --start_col / --end_col 을 절대 넘기지 않습니다.
      # 스크립트는 리포 루트에 있으므로 루트에서 실행합니다.
      - name: Run delete script (use script defaults)
        working-directory: .
        run: |
          ls -la
          python delete_excel_columns.py

      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: delete excel columns (defaults only)"
          git push
